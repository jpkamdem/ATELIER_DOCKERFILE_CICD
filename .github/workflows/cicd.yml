name: Atelier CI/CD

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: atelier-flask

jobs:
  testing:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Installation des dépendances
        run: pip install -r requirements.txt pytest
      - name: Lancer les tests
        run: pytest -v tests/

  building:
    runs-on: ubuntu-24.04
    needs: testing
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t $IMAGE_NAME .
      - name: Exporter l'image dans un fichier
        run: docker save $IMAGE_NAME -o image.tar
      - name: Transferer vers prochain job
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: .

  deployment:
    runs-on: ubuntu-24.04
    needs: building
    environment: production
    steps:
      - name: Récupérer l'image du job 2
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: .
      - name: Charger l'image dans Docker
        run: docker load -i image.tar
      - name: Démarrer le conteneur
        run: docker run -dp 4000:4000 $IMAGE_NAME
      - name: Vérifier que l'application répond
        run: curl http://localhost:4000/
      - name: Afficher un message de succès dans le résumé du pipeline
        run: echo "..." >> $GITHUB_STEP_SUMMARY
